openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: Sillage owner, library, sharing and guest proposal API.
servers:
  - url: /api
tags:
  - name: health
  - name: owner
  - name: guest
  - name: dj-transfer
  - name: theme
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content: { application/json: { schema: { $ref: "#/components/schemas/HealthStatus" } } }
  /owner/state:
    get:
      operationId: getOwnerState
      tags: [owner]
      responses:
        "200":
          description: Owner state
          content: { application/json: { schema: { $ref: "#/components/schemas/OwnerState" } } }
  /owner/import:
    post:
      operationId: importPrototype
      tags: [owner]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PrototypeImport" } } }
      responses:
        "200": { description: Imported, content: { application/json: { schema: { $ref: "#/components/schemas/OwnerState" } } } }
  /events:
    post:
      operationId: createEvent
      tags: [owner]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EventInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } } }
  /events/{eventId}:
    patch:
      operationId: updateEvent
      tags: [owner]
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EventInput" } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } } }
  /events/{eventId}/theme:
    get:
      operationId: getEventTheme
      tags: [theme]
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      responses:
        "200":
          description: Saved event theme
          content: { application/json: { schema: { $ref: "#/components/schemas/EventTheme" } } }
    put:
      operationId: updateEventTheme
      tags: [theme]
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateEventTheme" } } }
      responses:
        "200":
          description: Saved event theme
          content: { application/json: { schema: { $ref: "#/components/schemas/EventTheme" } } }
        "409": { description: Revision conflict }
  /events/{eventId}/theme/images:
    post:
      operationId: uploadEventThemeImage
      tags: [theme]
      description: Accepts an image/jpeg, image/png, or image/webp binary body. Multipart/form-data with a single image field is also accepted.
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        "201":
          description: Staged image; it is not selected until the theme is saved.
          content: { application/json: { schema: { $ref: "#/components/schemas/ThemeImageUploadResponse" } } }
  /events/{eventId}/theme/images/{imageId}:
    get:
      operationId: getEventThemeImage
      tags: [theme]
      parameters:
        - { $ref: "#/components/parameters/EventId" }
        - { $ref: "#/components/parameters/ImageId" }
      responses:
        "200":
          description: Private owner image preview
          content:
            image/webp: { schema: { type: string, format: binary } }
    delete:
      operationId: deleteEventThemeImage
      tags: [theme]
      parameters:
        - { $ref: "#/components/parameters/EventId" }
        - { $ref: "#/components/parameters/ImageId" }
      responses:
        "204": { description: Deleted staged or unused image }
        "409": { description: The currently selected image must be deselected first }
  /events/{eventId}/tracks:
    post:
      operationId: createTrack
      tags: [owner]
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TrackInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Track" } } } }
  /tracks/{trackId}:
    patch:
      operationId: updateTrackMetadata
      tags: [owner]
      parameters: [{ $ref: "#/components/parameters/TrackId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [title, artist], properties: { title: { type: string }, artist: { type: string }, album: { type: string } } } } }
      responses: { "200": { description: Updated } }
  /events/{eventId}/catalogue:
    get:
      operationId: searchCatalogue
      tags: [owner]
      parameters:
        - { $ref: "#/components/parameters/EventId" }
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 2, maxLength: 120 }
      responses:
        "200": { description: iTunes preview results, content: { application/json: { schema: { type: object, required: [results, attribution], properties: { results: { type: array, items: { $ref: "#/components/schemas/Track" } }, attribution: { type: string } } } } } }
  /events/{eventId}/uploads/request:
    post:
      operationId: requestAudioUpload
      tags: [owner]
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UploadRequest" } } }
      responses:
        "200": { description: Signed PUT URL, content: { application/json: { schema: { $ref: "#/components/schemas/UploadResponse" } } } }
  /events/{eventId}/uploads/finalize:
    post:
      operationId: finalizeAudioUpload
      tags: [owner]
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UploadFinalize" } } }
      responses:
        "201": { description: Uploaded track, content: { application/json: { schema: { $ref: "#/components/schemas/Track" } } } }
  /tracks/{trackId}/stream:
    get:
      operationId: streamOwnedAudio
      tags: [owner]
      parameters: [{ $ref: "#/components/parameters/TrackId" }]
      responses:
        "200": { description: Audio stream }
        "206": { description: Partial audio stream }
  /events/{eventId}/playlists:
    post:
      operationId: createPlaylist
      tags: [owner]
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PlaylistInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Playlist" } } } }
  /events/{eventId}/folders:
    post:
      operationId: createFolder
      tags: [owner]
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string } } } } }
      responses: { "201": { description: Created } }
  /folders/{folderId}:
    delete:
      operationId: deleteFolder
      tags: [owner]
      parameters: [{ in: path, name: folderId, required: true, schema: { type: string } }]
      responses: { "204": { description: Deleted } }
  /playlists/{playlistId}:
    patch:
      operationId: updatePlaylist
      tags: [owner]
      parameters: [{ $ref: "#/components/parameters/PlaylistId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PlaylistInput" } } }
      responses: { "200": { description: Updated } }
    delete:
      operationId: deletePlaylist
      tags: [owner]
      parameters: [{ $ref: "#/components/parameters/PlaylistId" }]
      responses: { "204": { description: Deleted } }
  /playlists/{playlistId}/tracks:
    put:
      operationId: replacePlaylistTracks
      tags: [owner]
      parameters: [{ $ref: "#/components/parameters/PlaylistId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [trackIds, revision], properties: { trackIds: { type: array, items: { type: string } }, revision: { type: integer } } } } }
      responses: { "200": { description: Reordered } }
  /playlists/{playlistId}/tracks/{trackId}:
    delete:
      operationId: removePlaylistTrack
      tags: [owner]
      parameters: [{ $ref: "#/components/parameters/PlaylistId" }, { $ref: "#/components/parameters/TrackId" }]
      responses: { "204": { description: Removed } }
  /events/{eventId}/moments/{momentId}:
    delete:
      operationId: deleteMoment
      tags: [owner]
      parameters: [{ $ref: "#/components/parameters/EventId" }, { $ref: "#/components/parameters/MomentId" }]
      responses: { "204": { description: Deleted } }
    patch:
      operationId: updateMoment
      tags: [owner]
      parameters: [{ $ref: "#/components/parameters/EventId" }, { $ref: "#/components/parameters/MomentId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MomentInput" } } }
      responses: { "200": { description: Updated } }
  /events/{eventId}/moments:
    post:
      operationId: createMoment
      tags: [owner]
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MomentInput" } } }
      responses: { "201": { description: Created } }
  /events/{eventId}/moments/{momentId}/tracks:
    put:
      operationId: replaceMomentTracks
      tags: [owner]
      parameters: [{ $ref: "#/components/parameters/EventId" }, { $ref: "#/components/parameters/MomentId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [trackIds, revision], properties: { trackIds: { type: array, items: { type: string } }, revision: { type: integer } } } } }
      responses: { "200": { description: Updated } }
  /events/{eventId}/share:
    get:
      operationId: listShareLinks
      tags: [owner]
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      responses:
        "200":
          description: Links
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ShareLink" }
    post:
      operationId: createShareLink
      tags: [owner]
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      responses:
        "201": { description: Link created, content: { application/json: { schema: { $ref: "#/components/schemas/ShareLink" } } } }
  /share/{shareId}:
    delete:
      operationId: revokeShareLink
      tags: [owner]
      parameters: [{ $ref: "#/components/parameters/ShareId" }]
      responses: { "204": { description: Revoked } }
  /guest/{token}:
    get:
      operationId: getGuestEvent
      tags: [guest]
      parameters: [{ $ref: "#/components/parameters/Token" }]
      responses:
        "200": { description: Guest-safe event, content: { application/json: { schema: { $ref: "#/components/schemas/GuestEvent" } } } }
  /guest/{token}/theme:
    get:
      operationId: getGuestTheme
      tags: [theme]
      parameters: [{ $ref: "#/components/parameters/Token" }]
      responses:
        "200":
          description: Active-share theme; private image fields are null without consent
          content: { application/json: { schema: { $ref: "#/components/schemas/EventTheme" } } }
  /guest/{token}/theme/image:
    get:
      operationId: getGuestThemeImage
      tags: [theme]
      parameters: [{ $ref: "#/components/parameters/Token" }]
      responses:
        "200":
          description: Current consented private image
          headers:
            Cache-Control: { schema: { type: string, example: "private, no-store" } }
          content:
            image/webp: { schema: { type: string, format: binary } }
  /guest/{token}/catalogue:
    get:
      operationId: searchGuestCatalogue
      tags: [guest]
      parameters: [{ $ref: "#/components/parameters/Token" }, { in: query, name: q, required: true, schema: { type: string, minLength: 2, maxLength: 120 } }]
      responses: { "200": { description: Search results } }
  /guest/{token}/proposals:
    post:
      operationId: submitGuestProposal
      tags: [guest]
      parameters: [{ $ref: "#/components/parameters/Token" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProposalInput" } } }
      responses: { "201": { description: Proposal submitted, content: { application/json: { schema: { $ref: "#/components/schemas/Proposal" } } } } }
  /guest/{token}/proposals/{proposalId}/vote:
    post:
      operationId: voteGuestProposal
      tags: [guest]
      parameters: [{ $ref: "#/components/parameters/Token" }, { $ref: "#/components/parameters/ProposalId" }]
      responses: { "200": { description: Vote saved } }
  /proposals/{proposalId}:
    patch:
      operationId: moderateProposal
      tags: [owner]
      parameters: [{ $ref: "#/components/parameters/ProposalId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [approved, rejected] }, playlistId: { type: string }, revision: { type: integer } } } } }
      responses: { "200": { description: Moderated } }
  /events/{eventId}/dj-transfers:
    post:
      operationId: createDjTransfer
      tags: [dj-transfer]
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DjTransferCreate" }
      responses:
        "201":
          description: DJ transfer created. The URL is a copyable application URL; no email is sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DjTransfer" }
    get:
      operationId: listDjTransfers
      tags: [dj-transfer]
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      responses:
        "200":
          description: Owner transfer history, including revoked and expired grants.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DjTransfer" }
  /dj-transfers/received:
    get:
      operationId: listReceivedDjTransfers
      tags: [dj-transfer]
      responses:
        "200":
          description: Grants addressed to the signed-in user's verified Clerk email or already bound to that user.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DjTransfer" }
  /dj-transfers/{transferId}/revoke:
    post:
      operationId: revokeDjTransfer
      tags: [dj-transfer]
      parameters: [{ $ref: "#/components/parameters/TransferId" }]
      responses:
        "200":
          description: Transfer revoked. Requests authorized before the revocation may finish their current stream.
          content:
            application/json:
              schema:
                type: object
                required: [id, revokedAt]
                properties:
                  id: { type: string, format: uuid }
                  revokedAt: { type: string, format: date-time }
  /dj-transfers/{transferId}:
    get:
      operationId: getDjTransfer
      tags: [dj-transfer]
      parameters: [{ $ref: "#/components/parameters/TransferId" }]
      responses:
        "200":
          description: Selected tracks for the verified recipient, or an owner view with owner-only download history. First recipient access atomically binds an unbound email grant to that Clerk user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DjTransfer" }
  /dj-transfers/{transferId}/tracks/{trackId}/download:
    get:
      operationId: downloadDjTransferTrack
      tags: [dj-transfer]
      description: Full private attachment only; Range headers are ignored and the endpoint never returns a signed storage URL.
      parameters:
        - { $ref: "#/components/parameters/TransferId" }
        - { $ref: "#/components/parameters/TrackId" }
      responses:
        "200":
          description: Full private audio attachment. A completed response means the server transferred the bytes; it cannot observe whether a browser saved the file.
          headers:
            Content-Disposition: { schema: { type: string } }
            Cache-Control: { schema: { type: string, example: "private, no-store" } }
          content:
            audio/*:
              schema: { type: string, format: binary }
        "404": { description: Grant inactive or track not selected }
        "416": { description: Reserved for clients that require byte ranges; this implementation ignores Range and returns a full attachment }
components:
  parameters:
    EventId: { in: path, name: eventId, required: true, schema: { type: string } }
    TrackId: { in: path, name: trackId, required: true, schema: { type: string } }
    PlaylistId: { in: path, name: playlistId, required: true, schema: { type: string } }
    MomentId: { in: path, name: momentId, required: true, schema: { type: string } }
    ShareId: { in: path, name: shareId, required: true, schema: { type: string } }
    ImageId: { in: path, name: imageId, required: true, schema: { type: string, format: uuid } }
    ProposalId: { in: path, name: proposalId, required: true, schema: { type: string } }
    Token: { in: path, name: token, required: true, schema: { type: string } }
    TransferId: { in: path, name: transferId, required: true, schema: { type: string, format: uuid } }
  schemas:
    HealthStatus: { type: object, required: [status], properties: { status: { type: string } } }
    EventInput: { type: object, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 120 }, date: { type: string, nullable: true } } }
    Event: { allOf: [{ $ref: "#/components/schemas/EventInput" }, { type: object, required: [id, revision], properties: { id: { type: string }, revision: { type: integer } } }] }
    TrackInput:
      type: object
      required: [title, artist, source]
      properties:
        title: { type: string, maxLength: 200 }
        artist: { type: string, maxLength: 200 }
        album: { type: string }
        cover: { type: string, nullable: true }
        duration: { type: number, nullable: true }
        previewUrl: { type: string, nullable: true }
        storeUrl: { type: string, nullable: true }
        source: { type: string, enum: [catalogue, upload] }
    Track: { allOf: [{ $ref: "#/components/schemas/TrackInput" }, { type: object, required: [id], properties: { id: { type: string }, bpm: { type: number, nullable: true }, key: { type: string, nullable: true }, energy: { type: number, nullable: true } } }] }
    UploadRequest: { type: object, required: [name, size, contentType, rightsConfirmed], properties: { name: { type: string }, size: { type: integer, maximum: 104857600 }, contentType: { type: string }, rightsConfirmed: { type: boolean } } }
    UploadResponse: { type: object, required: [uploadUrl, objectPath, intentId], properties: { uploadUrl: { type: string }, objectPath: { type: string }, intentId: { type: string } } }
    UploadFinalize: { allOf: [{ $ref: "#/components/schemas/TrackInput" }, { type: object, required: [intentId, objectPath, size, contentType, rightsConfirmed], properties: { intentId: { type: string }, objectPath: { type: string }, size: { type: integer }, contentType: { type: string }, rightsConfirmed: { type: boolean } } }] }
    PlaylistInput: { type: object, required: [name, type], properties: { name: { type: string }, description: { type: string }, type: { type: string, enum: [collection, dj-set] }, folderId: { type: string, nullable: true }, revision: { type: integer } } }
    Playlist: { allOf: [{ $ref: "#/components/schemas/PlaylistInput" }, { type: object, required: [id, tracks, revision], properties: { id: { type: string }, tracks: { type: array, items: { $ref: "#/components/schemas/Track" } }, revision: { type: integer } } }] }
    MomentInput: { type: object, required: [title, time, duration], properties: { title: { type: string }, time: { type: string }, duration: { type: integer }, expectedEnergy: { type: integer, nullable: true }, notes: { type: string, nullable: true }, revision: { type: integer } } }
    ProposalInput: { type: object, required: [guestName, catalogueId], properties: { guestName: { type: string, minLength: 1, maxLength: 80 }, message: { type: string, maxLength: 500 }, catalogueId: { type: integer } } }
    Proposal: { type: object, required: [id, guestName, message, track, status, votes], properties: { id: { type: string }, guestName: { type: string }, message: { type: string }, track: { $ref: "#/components/schemas/Track" }, status: { type: string }, votes: { type: integer } } }
    ShareLink: { type: object, required: [id, token, url], properties: { id: { type: string }, token: { type: string, nullable: true }, url: { type: string, nullable: true }, createdAt: { type: string } } }
    GuestEvent: { type: object, required: [name, proposals], properties: { name: { type: string }, proposals: { type: array, items: { $ref: "#/components/schemas/Proposal" } } } }
    EventTheme:
      type: object
      required: [mode, imageId, imageUrl, focalX, focalY, overlay, guestImageConsent, revision]
      properties:
        mode: { type: string, enum: [studio, editorial, signature] }
        imageId: { type: string, format: uuid, nullable: true }
        imageUrl: { type: string, nullable: true, description: API image route; never an object-storage URL }
        focalX: { type: number, minimum: 0, maximum: 100 }
        focalY: { type: number, minimum: 0, maximum: 100 }
        overlay: { type: number, minimum: 0, maximum: 1 }
        guestImageConsent: { type: boolean }
        revision: { type: integer, minimum: 1 }
    UpdateEventTheme:
      type: object
      additionalProperties: false
      required: [mode, imageId, focalX, focalY, overlay, guestImageConsent, revision]
      properties:
        mode: { type: string, enum: [studio, editorial, signature] }
        imageId: { type: string, format: uuid, nullable: true }
        focalX: { type: number, minimum: 0, maximum: 100 }
        focalY: { type: number, minimum: 0, maximum: 100 }
        overlay: { type: number, minimum: 0, maximum: 1 }
        guestImageConsent: { type: boolean }
        revision: { type: integer, minimum: 1 }
    ThemeImageUploadResponse:
      type: object
      required: [imageId, imageUrl]
      properties:
        imageId: { type: string, format: uuid }
        imageUrl: { type: string, description: API image route; never an object-storage URL }
    DjTransferCreate:
      type: object
      required: [recipientEmail, trackIds, expiresAt, rightsConfirmed]
      properties:
        recipientEmail: { type: string, format: email, maxLength: 320 }
        trackIds:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time, description: Future ISO timestamp, no more than 90 days from creation }
        rightsConfirmed: { type: boolean, const: true }
    DjTransferTrack:
      type: object
      required: [id, title, artist, album, mimeType, byteSize, downloadUrl]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        artist: { type: string }
        album: { type: string }
        mimeType: { type: string }
        byteSize: { type: integer, minimum: 1 }
        downloadUrl: { type: string, description: API download endpoint; never an object-storage URL }
    DjTransferHistory:
      type: object
      required: [id, trackId, titleSnapshot, status, djUserId, startedAt, completedAt]
      properties:
        id: { type: string, format: uuid }
        trackId: { type: string, format: uuid, nullable: true }
        titleSnapshot: { type: string, nullable: true, description: "Transferred file title captured when the attempt was authorized" }
        status: { type: string, enum: [initiated, served, failed, aborted] }
        djUserId: { type: string, nullable: true, description: "Clerk account id that initiated the attempt" }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
    DjTransfer:
      type: object
      required: [id, eventId, eventName, url, recipientEmail, recipientUserId, boundAt, rightsConfirmedAt, expiresAt, revokedAt, createdAt, status, tracks]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        eventName: { type: string, description: Event name snapshot retained for transfer history }
        url: { type: string, description: "Copyable application URL /dj-transfers/{id}" }
        recipientEmail: { type: string, format: email }
        recipientUserId: { type: string, nullable: true, description: Bound Clerk user id; null until first verified-email access }
        boundAt: { type: string, format: date-time, nullable: true }
        rightsConfirmedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        status: { type: string, enum: [pending, active, expired, revoked] }
        tracks: { type: array, items: { $ref: "#/components/schemas/DjTransferTrack" } }
        history:
          type: array
          description: "Owner-only download audit history; omitted for recipient responses"
          items: { $ref: "#/components/schemas/DjTransferHistory" }
    OwnerState:
      type: object
